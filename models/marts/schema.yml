version: 2

models:
  - name: dim_customer
    description: One row per customer.
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: dim_product
    description: One row per product, enriched with category and brand.
    columns:
      - name: product_id
        tests: [not_null, unique]
  - name: dim_order_status
    description: Order status lookup dimension.
    columns:
      - name: order_status_id
        tests: [not_null, unique]
  - name: dim_date
    description: Continuous calendar from the first through last order date.
    columns:
      - name: date_day
        tests: [not_null, unique]
  - name: fact_order_items
    description: One row per order item; line sales are before tax and shipping.
    columns:
      - name: order_item_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id
      - name: order_status_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_order_status')
                field: order_status_id
  - name: fact_orders
    description: One row per order; total includes order-level amounts.
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
  - name: fact_payments
    description: One row per payment transaction.
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
  - name: fact_shipments
    description: One row per shipment.
    columns:
      - name: shipment_id
        tests: [not_null, unique]
      - name: order_id
        tests:
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
  - name: fact_returns
    description: One row per return record.
    columns:
      - name: return_id
        tests: [not_null, unique]
  - name: mart_customer_360
    description: One row per customer with order and review summaries.
    columns:
      - name: customer_id
        tests: [not_null, unique]
  - name: fact_support_tickets
    description: One row per customer support ticket.
    columns:
      - name: support_ticket_id
        tests: [not_null, unique]
  - name: fact_inventory_current
    description: Current inventory per inventory record and warehouse.
    columns:
      - name: inventory_id
        tests: [not_null, unique]
