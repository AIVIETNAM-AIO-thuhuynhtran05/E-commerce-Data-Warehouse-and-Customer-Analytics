version: 2

models:
  - name: int_orders__payments_agg
    description: Payments aggregated to one row per order.
    columns:
      - name: order_id
        data_tests: [not_null, unique]

  - name: int_orders__enriched
    description: >
      One row per order with status business rules (from the order_status_mapping
      seed), item counts and payment totals. counts_as_revenue is defined here only.
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: counts_as_revenue
        description: True for paid, shipped and delivered orders.
        data_tests: [not_null]
      - name: has_items
        description: False for orders without any order item (shipping-only orders).

  - name: int_order_items__enriched
    description: >
      One row per order item with order context, allocated discount and refunded
      returns. Feeds fact_sales.
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: discount_amount
        description: Order discount allocated to the line by its share of gross amount.
      - name: net_amount
        description: gross_amount - discount_amount, before tax and shipping.
      - name: refunded_quantity
        description: Quantity from returns with status refunded.
      - name: refunded_amount
        description: >
          Net unit price (after the allocated discount) times refunded_quantity.
          Before tax, without shipping.
      - name: recognized_revenue
        description: net_amount when the order status counts as revenue, else 0.

  - name: int_customers__order_history
    description: Order history summary, one row per customer with at least one order.
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
      - name: lifetime_order_value
        description: Sum of order_total over every order, any status, including tax and shipping.
      - name: lifetime_revenue
        description: >
          Sum of order_total over paid, shipped and delivered orders, including
          tax and shipping. Not the same basis as recognized_revenue (README,
          design decision 9).

  - name: int_addresses__geography
    description: One row per address with its location attributes and geography_key.
    columns:
      - name: address_id
        data_tests: [not_null, unique]
      - name: geography_key
        data_tests: [not_null]

  - name: int_inventory__product_warehouse
    description: >
      Current inventory with one row per product and warehouse. The source has
      224 product-warehouse pairs spread over several records; quantities are
      summed and the reorder level is the maximum of those records.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_key, warehouse_id]
    columns:
      - name: record_count
        description: Number of source inventory records merged into this row.
