name: ecommerce_analytics
version: "2.0.0"
config-version: 2

profile: ecommerce_analytics

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Calendar range for dim_date. It must cover every date used by the facts.
  calendar_start_date: "2019-01-01"
  calendar_end_date: "2026-12-31"

models:
  ecommerce_analytics:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +materialized: table
      core:
        +schema: core
      sales:
        +schema: sales
      customer:
        +schema: customer
      operations:
        +schema: operations

seeds:
  ecommerce_analytics:
    +schema: seeds

snapshots:
  ecommerce_analytics:
    +schema: snapshots
